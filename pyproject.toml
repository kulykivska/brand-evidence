[project]
name = "brand-evidence"
version = "0.1.0"
description = "Contemporaneous evidence of trademark use plus daily brand mention monitoring, local-first."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "playwright>=1.45",
    "structlog>=24.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
    "asn1crypto>=1.5.1",
]

[project.optional-dependencies]
classification = ["anthropic>=0.40"]

[project.scripts]
brand-evidence = "brand_evidence.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-bdd>=7.2",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brand_evidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
bdd_features_base_dir = "features"
filterwarnings = ["error::DeprecationWarning:brand_evidence.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
per-file-ignores = { "tests/*" = ["S101", "S106"] }

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
