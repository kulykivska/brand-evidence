name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check .
      - run: uv run mypy src
      # The suite must pass with no network and no credentials: every source
      # and every archive call is faked at the boundary.
      - run: uv run pytest -q
