# Example: run the daily crawl on GitHub Actions instead of local launchd.
#
# Copy this into .github/workflows/ of YOUR OWN repository. Two warnings before
# you do:
#
#   1. Use a PRIVATE repository. This job caches the evidence database and
#      uploads the digest as an artifact, and in a public repository both are
#      readable by anyone who can see the repo.
#   2. The evidence log is only as trustworthy as the machine that appends to
#      it. A hosted runner rebuilds the database from a cache on every run; for
#      evidence you intend to rely on, prefer the local launchd schedule
#      (`brand-evidence schedule install`) on a machine you control.
#
# Required repository variable: BE_BRAND_TERMS.
# Required secrets: whichever sources you enable (see .env.example).

name: daily-crawl
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - name: Restore database
        uses: actions/cache@v4
        with:
          path: brand-evidence.db
          key: brand-evidence-db-${{ github.run_id }}
          restore-keys: brand-evidence-db-
      - run: uv run brand-evidence init
        env: &env
          BE_DB_PATH: ./brand-evidence.db
          BE_STORE_PATH: ./store
          BE_DIGEST_PATH: ./digests
          BE_BRAND_TERMS: ${{ vars.BE_BRAND_TERMS }}
          BE_ARCHIVE_PROVIDER: wayback
          BE_WAYBACK_ACCESS_KEY: ${{ secrets.BE_WAYBACK_ACCESS_KEY }}
          BE_WAYBACK_SECRET_KEY: ${{ secrets.BE_WAYBACK_SECRET_KEY }}
          BE_GOOGLE_ALERTS_FEEDS: ${{ secrets.BE_GOOGLE_ALERTS_FEEDS }}
          BE_REDDIT_CLIENT_ID: ${{ secrets.BE_REDDIT_CLIENT_ID }}
          BE_REDDIT_CLIENT_SECRET: ${{ secrets.BE_REDDIT_CLIENT_SECRET }}
      - run: uv run brand-evidence crawl --no-capture
        env: *env
      - run: uv run brand-evidence digest
        env: *env
      - uses: actions/upload-artifact@v4
        with:
          name: digest
          path: digests/
